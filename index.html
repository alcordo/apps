<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alcordo Apps</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f4f8;
            color: #333;
            text-align: center;
            padding: 50px;
        }
        h1 {
            color: #512BD4;
        }
        .app-list {
            list-style-type: none;
            padding: 0;
        }
        .app-list li {
            margin: 15px 0;
        }
        .app-list a {
            text-decoration: none;
            color: #fff;
            background-color: #512BD4;
            padding: 10px 20px;
            border-radius: 5px;
            transition: background-color 0.3s;
        }
        .app-list a:hover {
            background-color: #3a1fb8;
        }
    </style>
</head>
<body>
    <h1>Welcome to Alcordo Apps</h1> 
</body>
</html>
